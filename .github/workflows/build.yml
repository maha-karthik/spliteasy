name: Build SplitEasy

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: publish a permanent GitHub Release with this tag (e.g. v0.2.1-stage2a)'
        required: false
        default: ''
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold (first build only)
        run: |
          set -o pipefail
          if [ ! -d android ]; then
            flutter create --org com.karthik --project-name spliteasy --platforms android . 2>&1 | tee -a build.log
          fi
          # flutter create writes a sample test that references a MyApp class this project does not have.
          rm -f test/widget_test.dart
          python3 tools/apply_android.py 2>&1 | tee -a build.log

      - name: Dependencies
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a build.log

      - name: Analyze (informational)
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee -a build.log

      - name: SQLite library for database tests
        run: sudo apt-get install -y libsqlite3-dev

      - name: Unit tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee -a build.log

      - name: Restore signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          else
            echo "No keystore secret set: building with the debug key (fine for testing, NOT for Play Store)."
          fi

      - name: Build per-ABI APKs (small, for sideload testing)
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee -a build.log

      - name: Build AAB (Play Store upload)
        run: |
          set -o pipefail
          flutter build appbundle --release 2>&1 | tee -a build.log

      - name: Show signing certificates
        run: |
          echo "--- AAB (jar signature)" | tee -a build.log
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab 2>&1 | grep -E "Owner:|SHA256:" | tee -a build.log
          echo "--- APK (v2/v3 signature)" | tee -a build.log
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk 2>&1 | grep -E "Signer #1|WARNING|ERROR" | tee -a build.log
          else
            echo "apksigner not found under $SDK" | tee -a build.log
          fi

      - name: Upload build log (always, so failures can be pasted to the agent)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: spliteasy-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

      - name: Permanent GitHub Release (only when release_tag is given)
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          gh release create "$TAG" --target "${{ github.sha }}" --title "$TAG" --notes "SplitEasy $TAG" \
            build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/release/*.aab
