name: Build SplitEasy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold (first build only)
        run: |
          set -o pipefail
          if [ ! -d android ]; then
            flutter create --org com.karthik --project-name spliteasy --platforms android . 2>&1 | tee -a build.log
          fi
          python3 tools/apply_android.py 2>&1 | tee -a build.log

      - name: Dependencies
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a build.log

      - name: Analyze (informational)
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee -a build.log

      - name: Unit tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee -a build.log

      - name: Restore signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          else
            echo "No keystore secret set: building with the debug key (fine for testing, NOT for Play Store)."
          fi

      - name: Build per-ABI APKs (small, for sideload testing)
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee -a build.log

      - name: Build AAB (Play Store upload)
        run: |
          set -o pipefail
          flutter build appbundle --release 2>&1 | tee -a build.log

      - name: Upload build log (always, so failures can be pasted to the agent)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: spliteasy-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
