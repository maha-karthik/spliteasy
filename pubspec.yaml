name: spliteasy
description: Offline-first expense splitter with UPI proof verification (screenshot, SMS, bill).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  system_contact_picker: ^0.0.4
  google_mlkit_text_recognition: ^0.13.1
  receive_sharing_intent: ^1.8.0
  flutter_tts: ^4.0.2
  url_launcher: ^6.3.0
  pdf: ^3.11.0
  share_plus: ^10.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.0 # tests only: runs the real database code and upgrades on the CI machine

flutter:
  uses-material-design: true
